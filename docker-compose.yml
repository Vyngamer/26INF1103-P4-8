services:
  ai-counsellor_part2:
    build:
      context: .
      no_cache: true
    env_file: ".env"
    environment:
      - DISPLAY=${DISPLAY:-:0}
    stdin_open: true
    tty: true
    ports:
      - "5000:5000"
    volumes:
      - ${X11_SOCKET:-/run/desktop/mnt/host/wslg/.X11-unix}:/tmp/.X11-unix
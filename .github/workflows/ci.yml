name: Run Pytest

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          # python -m pytest tests/test_ai_manager.py -v
          python -m pytest tests/test_data_manager.py -v
          python -m pytest tests/test_io_manager.py -v
          python -m pytest tests/test_logic_manager.py -v
          python -m pytest tests/ai/test_conversation.py -v
          python -m pytest tests/ai/test_gemini_client.py -v
          
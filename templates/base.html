<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — AI Counsellor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href={{ url_for('static', filename='style.css') }}>
  <link rel="icon" href='static/assets/logo.png'>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<style>
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .popup {
    background: white;
    padding: 24px;
    text-align: center;
    border-radius: 5px;
  }
  .pop {
    padding: 8px 20px;
    margin: 8px 4px 0;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
  }
  .yes { background: green; }
  .no  { background: red; }
</style>
</head>


{% block content %}
{% endblock %}

</html>

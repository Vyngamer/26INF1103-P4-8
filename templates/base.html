<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — AI Counsellor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href={{ url_for('static', filename='style.css') }}>
  <link rel="icon" href='static/assets/logo.png'>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<style>
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .popup {
    background: white;
    padding: 24px;
    text-align: center;
    border-radius: 5px;
  }
  .pop {
    padding: 8px 20px;
    margin: 8px 4px 0;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
  }
  .yes { background: green; }
  .no  { background: red; }
  /* for flash message */
  .flash-message {
    position: fixed;
    top: 30px;
    right: 30px;
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;

    min-width: 350px;
    max-width: 500px;
    padding: 22px 26px;

    border-radius: 14px;
    background: #f0eafa;
    color: #6540ad;
    border-left: 6px solid #7952c7;

    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);

    font-size: 16px;
    font-weight: 500;
}

.flash-close {
    background: none;
    border: none;
    color: inherit;
    font-size: 28px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
    opacity: 0.7;
    flex-shrink: 0;
}

.flash-close:hover {
    opacity: 1;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(30px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}
</style>
</head>

<!-- for flash message -->
{% if request.endpoint in ['main', 'settings'] %}
  {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
          {% for category, message in messages %}
              <div class="flash-message flash-{{ category }}" role="alert">
                  <span>{{ message }}</span>

                  <button type="button" class="flash-close" aria-label="Close notification">
                      &times;
                  </button>
              </div>
          {% endfor %}
      {% endif %}
  {% endwith %}
{% endif %}

{% block content %}
{% endblock %}
<script>
    document.querySelectorAll('.flash-close').forEach(button => {
        button.addEventListener('click', () => {
            const message = button.closest('.flash-message');

            message.style.transition = "opacity 0.3s ease, transform 0.3s ease";
            message.style.opacity = "0";
            message.style.transform = "translateX(30px)";

            setTimeout(() => {
                message.remove();
            }, 300);
        });
    });
</script>
</html>
